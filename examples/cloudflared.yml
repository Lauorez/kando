# Beispiel für einen vorhandenen, lokal verwalteten Cloudflare-Tunnel.
# UUID, Zugangsdatenpfad und Hostnamen durch eigene Werte ersetzen.
# cloudflared läuft hier auf demselben Rechner wie KanDo (bzw. der Docker-Port).
tunnel: YOUR_TUNNEL_UUID
credentials-file: /path/to/YOUR_TUNNEL_UUID.json

ingress:
  - hostname: kando.example.org
    path: ^/mcp$
    service: http://127.0.0.1:3000
  - service: http_status:404
