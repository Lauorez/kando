# Template for an existing, locally managed Cloudflare Tunnel.
# Replace the UUID, credentials path, and hostname with your own values.
# Run cloudflared on the same host as KanDo (or its published Docker port).
tunnel: YOUR_TUNNEL_UUID
credentials-file: /path/to/YOUR_TUNNEL_UUID.json

ingress:
  - hostname: kando.example.org
    path: ^/mcp$
    service: http://127.0.0.1:3000
  - service: http_status:404
