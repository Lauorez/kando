<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141a18">
  <meta name="description" content="KanDo – your self-hosted priority task board." data-i18n-content="metaDescription">
  <title data-i18n="pageTitle">My tasks · KanDo</title>
  <link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script><script type="module" src="/app.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/" aria-label="KanDo home" data-i18n-aria-label="home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>KanDo</a>
    <div class="header-controls">
      <label class="theme-control"><span data-i18n="language">Language</span><select id="language" aria-label="Language" data-i18n-aria-label="language"><option value="en" lang="en">English</option><option value="de" lang="de">Deutsch</option></select></label>
      <label class="theme-control"><span data-i18n="appearance">Appearance</span><select id="theme" aria-label="Appearance" data-i18n-aria-label="appearance"><option value="system" data-i18n="system">System</option><option value="light" data-i18n="light">Light</option><option value="dark" data-i18n="dark">Dark</option></select></label>
    </div>
  </header>
  <main>
    <section class="page-heading">
      <div><h1 id="board-title" data-i18n="boardTitle">My tasks</h1><p id="summary" aria-live="polite">Loading tasks …</p></div>
      <button class="primary" id="new-task" data-i18n="newTask">+ New task</button>
    </section>
    <section class="board-tools" aria-label="Board tools" data-i18n-aria-label="tools">
      <input id="search" type="search" placeholder="Search tasks …" aria-label="Search tasks" data-i18n-placeholder="search" data-i18n-aria-label="searchLabel">
      <button class="secondary" id="refresh" data-i18n="refresh">Refresh</button>
    </section>
    <div class="board-overview"><label class="completed-filter"><input id="show-completed" type="checkbox" checked><span data-i18n="showCompleted">Show completed</span></label></div>
    <progress id="board-progress" value="0" max="1" aria-label="Task progress" data-i18n-aria-label="progress"></progress>
    <div id="error" class="error" role="alert" hidden></div>
    <section class="board" id="board" aria-label="Kanban board" data-i18n-aria-label="board" aria-busy="true"></section>
    <footer class="board-footer"><span id="save-state" role="status" data-i18n="loading">Loading board …</span></footer>
  </main>
  <dialog id="task-dialog">
    <form id="task-form">
      <div class="dialog-heading"><h2 id="dialog-title" data-i18n="createHeading">New task</h2><button type="button" class="icon-button" id="close-dialog" aria-label="Close" data-i18n-aria-label="close">×</button></div>
      <label><span data-i18n="title">Title</span><input name="title" required maxlength="160" placeholder="What would you like to do?" data-i18n-placeholder="titlePlaceholder"></label>
      <label><span data-i18n="description">Description</span><span class="optional" data-i18n="optional">optional</span><textarea name="description" maxlength="10000" rows="4" placeholder="Details, notes, or next steps …" data-i18n-placeholder="descriptionPlaceholder"></textarea></label>
      <input name="status" type="hidden" value="todo">
      <div class="form-grid">
        <label><span data-i18n="priority">Priority</span><select name="priority"><option value="low" data-i18n="low">Low</option><option value="medium" selected data-i18n="medium">Medium</option><option value="high" data-i18n="high">High</option></select></label>
        <label><span data-i18n="dueDate">Due date</span><span class="optional" data-i18n="optional">optional</span><input name="dueDate" type="date" min="0001-01-01" max="9999-12-31"></label>
      </div>
      <p id="form-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" class="danger" id="delete-task" data-i18n="delete" hidden>Delete</button><div><button type="button" class="secondary" id="cancel-dialog" data-i18n="cancel">Cancel</button><button type="submit" class="primary" id="save-task" data-i18n="create">Create task</button></div></div>
    </form>
  </dialog>
  <dialog id="delete-dialog"><div class="dialog-heading"><h2 data-i18n="deleteHeading">Delete task?</h2></div><p data-i18n="deleteDescription">This task will be permanently deleted.</p><p id="delete-error" class="error" role="alert" hidden></p><div class="confirm-actions"><button class="secondary" id="cancel-delete" data-i18n="keep">Keep task</button><button class="primary destructive" id="confirm-delete" data-i18n="confirmDelete">Delete task</button></div></dialog>
</body>
</html>
